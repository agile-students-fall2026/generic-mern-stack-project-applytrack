<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo/icon sizes: favicon.ico (16/32/48 px) for older browsers, favicon.svg for modern ones,
         apple-touch-icon.png (180 px) for iPhone home screens, manifest icons (192/512 px) for Android -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ApplyTrack: track every internship and job application in one place." />
    <title>ApplyTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved (or system) theme before React loads, so dark mode doesn't flash white. -->
    <script>
      ;(function () {
        var theme = 'light'
        try {
          theme =
            localStorage.getItem('applytrack-theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
